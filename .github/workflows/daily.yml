name: Daily kids Short

# GitHub never renders Blender. This laptop makes the film.
# Cron only uploads if approved/{id}_short.mp4 is already in the repo.

on:
  schedule:
    # 06:30 Asia/Kolkata
    - cron: "0 1 * * *"
    # Backup if GitHub skips the first cron
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kids-daily
  cancel-in-progress: false

env:
  KIDS_CI: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependencies
        run: pip install -r requirements.txt

      - name: Plan (PC gold only — never CPU Blender)
        id: plan
        run: |
          python main.py --daily --stage prepare --upload --no-pre-render
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("output/_ci/plan.json")
          d = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {
              "mode": "wait_pc", "shot_count": 0, "episode_id": ""
          }
          mode = d.get("mode") or "wait_pc"
          if mode == "render":
              mode = "wait_pc"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"mode={mode}\n")
              fh.write(f"episode_id={d.get('episode_id') or ''}\n")
          print(d)
          PY

      - name: Prove kids English channel
        if: steps.plan.outputs.mode == 'approved'
        run: python main.py --check-youtube

      - name: Upload PC gold film
        if: steps.plan.outputs.mode == 'approved'
        run: python main.py --daily --stage finish --upload --no-pre-render

      - name: Waiting for this PC
        if: steps.plan.outputs.mode != 'approved'
        run: |
          echo "No laptop gold in approved/ for the next unpublished day."
          echo "GitHub will not render on CPU. Run scripts/pc_daily.ps1 on the PC."

      - name: Save factory state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          date -u +"{\"at\":\"%Y-%m-%dT%H:%M:%SZ\",\"run_id\":\"$GITHUB_RUN_ID\"}" > data/last_run.json
          git add data/factory_state.json data/last_run.json
          if git diff --staged --quiet; then
            echo "No state change"
          else
            git commit -m "factory: record daily kids Short"
            git push
          fi
