name: Keep Actions alive

# GitHub turns off cron after ~60 days of no repo activity.
# This empty weekly ping is a backup if Daily kids Short misses a stretch.
on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty keepalive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: scheduled workflows"
          git push
